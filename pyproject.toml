[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bevjiwai-compilerfuse_jd105"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对编译器与算子融合专家·存储 IO 与计算的重叠相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bevjiwai" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bevjiwai.github.io"
Repository = "https://github.com/bevjiwai/compilerfuse_jd105"
Issues = "https://github.com/bevjiwai/compilerfuse_jd105/issues"

[project.scripts]
compilerfuse_jd105 = "compilerfuse_jd105:main"

[tool.setuptools]
py-modules = ["compilerfuse_jd105"]
